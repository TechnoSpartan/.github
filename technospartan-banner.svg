<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Fondo con gradiente sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente dorado para acentos -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  
  <!-- Líneas decorativas tech -->
  <g stroke="#30363d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>
  
  <!-- Grid de puntos sutil -->
  <g fill="#30363d" opacity="0.3">
    <circle cx="100" cy="80" r="2" />
    <circle cx="100" cy="120" r="2" />
    <circle cx="100" cy="160" r="2" />
    <circle cx="100" cy="200" r="2" />
    <circle cx="100" cy="240" r="2" />
    <circle cx="100" cy="280" r="2" />
    <circle cx="100" cy="320" r="2" />
    
    <circle cx="1100" cy="80" r="2" />
    <circle cx="1100" cy="120" r="2" />
    <circle cx="1100" cy="160" r="2" />
    <circle cx="1100" cy="200" r="2" />
    <circle cx="1100" cy="240" r="2" />
    <circle cx="1100" cy="280" r="2" />
    <circle cx="1100" cy="320" r="2" />
  </g>
  
  <!-- Casco espartano estilizado (icono minimalista) -->
  <g transform="translate(180, 200) scale(2.2)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corona del casco -->
    <path d="M-20,-15 L-15,-25 L-10,-15 L-5,-25 L0,-15 L5,-25 L10,-15 L15,-25 L20,-15" />
    <!-- Cara del casco -->
    <path d="M-20,-15 L-20,10 Q-20,20 -10,20 L10,20 Q20,20 20,10 L20,-15" />
    <!-- Visera/nariz -->
    <path d="M-5,-15 L-5,5 L0,10 L5,5 L5,-15" />
    <!-- Ojos -->
    <path d="M-15,-5 L-8,-5" />
    <path d="M8,-5 L15,-5" />
    <!-- Protector lateral -->
    <path d="M-22,-5 Q-28,0 -22,10" />
    <path d="M22,-5 Q28,0 22,10" />
    <!-- Barba/plumas estilizadas -->
    <path d="M-10,20 L-12,28" />
    <path d="M0,20 L0,30" />
    <path d="M10,20 L12,28" />
  </g>
  
  <!-- Nombre de la organización -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="-1">
    TechnoSpartan
  </text>
  
  <!-- Línea decorativa bajo el nombre -->
  <line x1="420" y1="190" x2="780" y2="190" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Eslogan -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#8b949e" text-anchor="middle" letter-spacing="4">
    PIENSA. CREA. ESCALA.
  </text>
  
  <!-- Subtítulo descriptivo -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6e7681" text-anchor="middle">
    Arquitectura de software · Cloud · Automatización con IA
  </text>
  
  <!-- Elemento decorativo: llaves de código -->
  <g fill="#30363d" opacity="0.5" font-family="monospace" font-size="14">
    <text x="50" y="350">{ }</text>
    <text x="1130" y="350">&lt;/&gt;</text>
    <text x="80" y="370">#</text>
    <text x="1100" y="370">$</text>
  </g>
  
  <!-- Líneas de conexión estilo circuito -->
  <g stroke="#f0883e" stroke-width="1" opacity="0.2" fill="none">
    <path d="M0,350 L100,350 L120,330 L150,330" />
    <path d="M1200,350 L1100,350 L1080,330 L1050,330" />
    <circle cx="150" cy="330" r="2" fill="#f0883e" stroke="none" />
    <circle cx="1050" cy="330" r="2" fill="#f0883e" stroke="none" />
  </g>
</svg>
